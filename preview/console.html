const params = new URLSearchParams(location.search)
let activeView = params.get('view') || 'tako-models'
let scene = params.get('scene') || 'signed-in'
let lang = params.get('lang') || 'zh'
let rail = false
let configState = {
  baseURL: 'https://tako.shiroha.tech', refreshIntervalMs: 1_800_000, syncRetryDelaysMs: [1000, 5000],
  defaultContextWindow: 128_000, pinned: ['deepseek-v4.1-flash', 'claude-fable-5-2'],
  include: [], exclude: [], includeClaudeCodeOnly: false, overrides: {},
  ui: { priceMode: 'detail', currency: 'cny', tokenUnit: 'M', layout: 'card', sort: 'rec' },
}
let activeModel = 'deepseek-v4.1-flash'

/* Mock fetch routing with stateful config & active model */
const realFetch = window.fetch
window.fetch = async (input, init) => {
  const url = String(typeof input === 'string' ? input : input && input.url)
  const method = (init && init.method) || 'GET'
  const data = FIXTURES[scene] || FIXTURES['signed-in']
  const reply = body => Promise.resolve(new Response(JSON.stringify(body), { status: 200, headers: { 'content-type': 'application/json' } }))
  if (url.includes('tako.status')) return reply(data.status)
  if (url.includes('tako.catalog')) return reply(data.catalog)
  if (url.includes('tako.notice')) return reply(data.notice)
  if (url.includes('tako.logs')) return reply(data.logs)
  if (url.includes('tako.usage')) return reply(data.usage)
  if (url.includes('tako.update')) return reply(data.update)
  if (url.includes('tako.config')) {
    if (method === 'POST' && init && init.body) {
      const body = JSON.parse(init.body)
      if (body && body.set) {
        if (Array.isArray(body.set.pinned)) configState.pinned = body.set.pinned
        if (body.set.ui) configState.ui = { ...configState.ui, ...body.set.ui }
      }
      return reply({ ok: true })
    }
    return reply({ ok: true, writable: true, config: configState, webSearchProvider: 'tako' })
  }
  if (url.includes('tako.model')) {
    if (method === 'POST' && init && init.body) {
      if (!data.status.configured) return reply({ ok: false, code: 'not-configured' })
      const body = JSON.parse(init.body)
      activeModel = body.model
      return reply({ ok: true, provider: 'tako', model: activeModel })
    }
    return reply({ ok: true, supported: true, writable: true, provider: 'tako', model: activeModel })
  }
  if (url.includes('tako.key')) return reply({ ok: true, maskedKey: 'cr_****K4Z8', me: data.status.me })
  if (url.includes('tako.logout')) return reply({ ok: true, action: 'removed' })
  if (url.includes('tako.sync')) return reply({ ok: true })
  if (url.includes('tako.login')) return reply({ status: 'idle' })
  return realFetch(input, init)
}

/* Locale service double */
let registeredDicts = null
const localeFace = {
  register(ns, dicts) { registeredDicts = dicts; return () => {} },
  bind() {
    return (key, p) => {
      const tpl = registeredDicts && registeredDicts[lang] && registeredDicts[lang][key]
      if (tpl === undefined) return key
      return p ? tpl.replace(/\{(\w+)\}/g, (m, k) => k in p ? String(p[k]) : m) : tpl
    }
  },
}

const slotEntries = []
const ctx = {
  slots: {
    inject(name, fn) { fn() },
    register(descriptor, component) { slotEntries.push({ ...descriptor, component }); return () => {} },
  },
  get(name) { return name === 'locale' ? localeFace : undefined },
  on() {}, effect(fn) { return fn },
}

let navRoot, footerRoot, mainRoot
let renderKey = 0

function renderMatrix(FooterComp, t) {
  const states = [
    ['正常套餐 (plan)', FIXTURES['signed-in'].status],
    ['低额度预警 (low)', FIXTURES['low-quota'].status],
    ['仅钱包按量 (balance)', FIXTURES['plan-less'].status],
    ['未登录 (empty)', FIXTURES['signed-out'].status],
  ]
  const origFetch = window.fetch
  // Build lightweight wrapper rendering FooterComp with overridden status via props-less isolated fetch isn't possible concurrently;
  // instead mount 4 scenes sequentially or wrap with status override in preview.
  // Even better: intercept fetch by query tag? FooterComp fetches /api/tako.status, so we render a sequential showcase using a small helper!
  function MatrixRow({ title, statusObj }) {
    const [ready, setReady] = React.useState(false)
    React.useEffect(() => { setReady(true) }, [])
    // Temporarily render each card using a per-row status override via React key?
    // Since FooterComp fetches `/api/tako.status`, we queue a short status override per mount.
    return h('div', { style: { display: 'flex', flexDirection: 'column', gap: '8px' } },
      h('div', { style: { fontWeight: 600, fontSize: '13px', color: 'var(--dsw-alias-label-secondary)' } }, title),
      h('div', { className: 'matrix-grid' },
        h('div', { className: 'matrix-col w240' }, h(ScopedFooter, { FooterComp, statusObj, wide: true, t })),
        h('div', { className: 'matrix-col w208' }, h(ScopedFooter, { FooterComp, statusObj, wide: true, t })),
        h('div', { className: 'matrix-col w56' }, h(ScopedFooter, { FooterComp, statusObj, wide: false, t }))))
  }
  const queue = []
  let busy = false
  function runNext() {
    if (busy || queue.length === 0) return
    busy = true
    const task = queue.shift()
    task(() => { busy = false; runNext() })
  }
  function ScopedFooter({ FooterComp, statusObj, wide, t }) {
    const [armed, setArmed] = React.useState(false)
    React.useEffect(() => {
      let alive = true
      queue.push(done => {
        if (!alive) { done(); return }
        const prev = window.fetch
        window.fetch = async (input, init) => {
          if (String(input).includes('tako.status')) {
            return new Response(JSON.stringify(statusObj), { status: 200, headers: { 'content-type': 'application/json' } })
          }
          return prev(input, init)
        }
        setArmed(true)
        setTimeout(() => { window.fetch = prev; done() }, 10)
      })
      runNext()
      return () => { alive = false }
    }, [statusObj, wide, lang])
    return armed ? h(FooterComp, { wide, t }) : h('div', { style: { fontSize: '11px', opacity: .5 } }, '…')
  }
  return h('div', { className: 'matrix-wrap', 'data-testid': 'footer-matrix' },
    h('h2', { style: { margin: 0, fontSize: '18px' } }, '侧栏底部额度卡 4 状态 × 3 宽度（240px / 208px / 56px 折叠环）'),
    states.map(([title, statusObj]) => h(MatrixRow, { key: title + lang, title, statusObj })))
}

function renderAll() {
  renderKey++
  const t = localeFace.bind()
  const navItems = slotEntries.filter(e => e.name === 'sidebar.panellist').sort((a, b) => (a.order || 0) - (b.order || 0))
  const Footer = slotEntries.find(e => e.name === 'sidebar.footer.action')
  const MainEntry = slotEntries.find(e => e.name === 'main' && e.key === activeView)

  navRoot.render(navItems.map(item => {
    const label = typeof item.label === 'function' ? item.label() : item.label
    return h('button', {
      key: item.id,
      type: 'button',
      'aria-label': label,
      'data-active': String(activeView === item.id),
      onClick: () => setView(item.id),
    }, h(item.component, { size: 18 }), h('span', { className: 'nav-label' }, label))
  }))

  footerRoot.render(Footer ? h(Footer.component, { key: `${scene}-${lang}-${rail}`, wide: !rail, t }) : null)

  if (activeView === 'footer-matrix' && Footer) {
    mainRoot.render(renderMatrix(Footer.component, t))
  } else if (MainEntry) {
    mainRoot.render(h(MainEntry.component, { key: `${activeView}-${scene}-${lang}`, t }))
  }
}

function setView(v) {
  activeView = v
  document.querySelectorAll('[data-view]').forEach(b => b.dataset.active = String(b.dataset.view === v))
  renderAll()
}
function setScene(s) {
  scene = s
  document.querySelectorAll('[data-scene]').forEach(b => b.dataset.active = String(b.dataset.scene === s))
  renderAll()
}
function setSize(sz) {
  const stage = document.getElementById('stage')
  const frame = document.getElementById('window-frame')
  document.querySelectorAll('[data-size]').forEach(b => b.dataset.active = String(b.dataset.size === sz))
  if (sz === 'full') { stage.classList.add('full'); return }
  stage.classList.remove('full')
  const [w, hh] = sz.split('x').map(Number)
  frame.style.width = `${w}px`
  frame.style.height = `${hh}px`
}
function setLang(l) {
  lang = l
  document.documentElement.lang = l === 'zh' ? 'zh-CN' : 'en'
  document.querySelectorAll('[data-lang]').forEach(b => b.dataset.active = String(b.dataset.lang === l))
  renderAll()
}
function setTheme(dark) {
  document.documentElement.dataset.theme = dark ? 'dark' : 'light'
  if (dark) document.body.setAttribute('data-ds-dark-theme', 'true')
  else document.body.removeAttribute('data-ds-dark-theme')
  document.getElementById('theme-toggle').textContent = dark ? 'Light' : 'Dark'
}

document.querySelectorAll('[data-view]').forEach(b => b.addEventListener('click', () => setView(b.dataset.view)))
document.querySelectorAll('[data-scene]').forEach(b => b.addEventListener('click', () => setScene(b.dataset.scene)))
document.querySelectorAll('[data-size]').forEach(b => b.addEventListener('click', () => setSize(b.dataset.size)))
document.querySelectorAll('[data-lang]').forEach(b => b.addEventListener('click', () => setLang(b.dataset.lang)))
document.getElementById('theme-toggle').addEventListener('click', () => setTheme(document.documentElement.dataset.theme !== 'dark'))
document.getElementById('rail-toggle').addEventListener('click', () => {
  rail = !rail
  document.getElementById('sidebar').classList.toggle('rail', rail)
  document.getElementById('rail-toggle').dataset.active = String(rail)
  renderAll()
})

if (params.get('theme') === 'dark') setTheme(true)
if (params.get('size')) setSize(params.get('size'))

const script = document.createElement('script')
script.src = '../client/client.js'
script.onload = () => {
  const loader = window.__ModuleLoader__._modules.find(m => m.id === 'dsh-tako')
  const plugin = loader.factory(name => name === 'react' ? React : undefined)
  plugin.apply(ctx)
  navRoot = ReactDOM.createRoot(document.getElementById('sidebar-nav'))
  footerRoot = ReactDOM.createRoot(document.getElementById('sidebar-footer'))
  mainRoot = ReactDOM.createRoot(document.getElementById('main-host'))
  setLang(lang)
  setView(activeView)
}
document.body.appendChild(script)
</script>
